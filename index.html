<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVOICE台帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f5f4f0; --panel:#ffffff; --ink:#1d2329; --sub:#5d6670; --line:#dedbd3;
  --accent:#1f4e79; --accent-soft:#e6eef6;
  --warn:#9a5b00; --warn-bg:#fff4e0; --err:#a42828; --err-bg:#fdeaea;
  --ok:#2e6b3a; --ok-bg:#e7f3e9;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ヘッダー */
header{background:var(--panel);border-bottom:1px solid var(--line);padding:0 20px;display:flex;align-items:center;gap:24px;height:56px;position:sticky;top:0;z-index:10}
header h1{font-size:16px;margin:0;letter-spacing:.04em}
nav{display:flex;gap:4px}
nav button{background:none;border:none;padding:8px 14px;border-radius:6px;color:var(--sub)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
header .who{margin-left:auto;color:var(--sub);font-size:12px;display:flex;gap:10px;align-items:center}
main{max-width:1280px;margin:0 auto;padding:20px}

.btn{border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.btn.danger{color:var(--err);border-color:#e5b9b9}
.btn:disabled{opacity:.5;cursor:default}

/* ログイン */
#login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px}
#login h2{margin:0 0 18px;font-size:18px}
#login label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px}
#login input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px}
#login .btn{width:100%;margin-top:18px}
#loginErr{color:var(--err);font-size:12px;margin-top:10px}

/* 取込 */
#drop{border:2px dashed #b9c4cf;border-radius:10px;background:var(--panel);padding:36px;text-align:center;color:var(--sub);transition:.15s}
#drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
#drop strong{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}
#drop .row{margin-top:14px;display:flex;gap:8px;justify-content:center}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:18px;overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:#faf9f6}
.card-head .fname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-head .state{margin-left:auto;font-size:12px;color:var(--sub)}
.card-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}
.card-body iframe{width:100%;height:640px;border:0;border-right:1px solid var(--line);background:#e9e7e1}
.form{padding:16px;overflow:auto;max-height:640px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.f label{display:block;font-size:11px;color:var(--sub);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:#fff}
.f.wide{grid-column:1/-1}
.num{font-family:var(--mono);text-align:right}
h4{margin:18px 0 8px;font-size:13px}
table.items{width:100%;border-collapse:collapse;font-size:12px}
table.items th{font-weight:500;color:var(--sub);text-align:left;padding:4px;border-bottom:1px solid var(--line);font-size:11px}
table.items td{padding:3px 2px}
table.items input{width:100%;padding:5px 6px;border:1px solid var(--line);border-radius:4px}
table.items .x{border:none;background:none;color:var(--sub);font-size:16px;padding:0 4px}
.alerts{margin-top:14px;display:flex;flex-direction:column;gap:6px}
.alert{padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.5}
.alert.warn{background:var(--warn-bg);color:var(--warn)}
.alert.err{background:var(--err-bg);color:var(--err)}
.alert.ok{background:var(--ok-bg);color:var(--ok)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 台帳 */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.toolbar input[type=search]{min-width:240px}
.toolbar .count{color:var(--sub);font-size:12px;margin-left:auto}
.tablewrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
table.ledger{width:100%;border-collapse:collapse;font-size:13px}
table.ledger th{position:sticky;top:0;background:#faf9f6;text-align:left;font-weight:500;color:var(--sub);font-size:11px;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.ledger td{padding:9px 10px;border-bottom:1px solid #eeece6;white-space:nowrap}
table.ledger tr:hover td{background:#fbfaf7;cursor:pointer}
.mono{font-family:var(--mono)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px}
.tag.need{background:var(--warn-bg);color:var(--warn)}
.tag.done{background:var(--ok-bg);color:var(--ok)}
.empty{padding:40px;text-align:center;color:var(--sub)}

/* 詳細 */
#modal{position:fixed;inset:0;background:rgba(20,25,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow:auto}
#modal .box{background:var(--panel);border-radius:10px;width:min(860px,100%);padding:22px}
#modal h3{margin:0 0 4px;font-size:17px}
#modal .meta{color:var(--sub);font-size:12px;margin-bottom:14px}
dl.kv{display:grid;grid-template-columns:110px 1fr 110px 1fr;gap:6px 12px;margin:0 0 6px;font-size:13px}
dl.kv dt{color:var(--sub);font-size:12px}
dl.kv dd{margin:0}

@media (max-width:860px){
  .card-body{grid-template-columns:1fr}
  .card-body iframe{height:380px;border-right:0;border-bottom:1px solid var(--line)}
  .form{max-height:none}
  dl.kv{grid-template-columns:100px 1fr}
  header{gap:12px;padding:0 12px}
  main{padding:16px}
}
</style>
</head>
<body>

<!-- ログイン -->
<section id="login" class="hidden">
  <h2>INVOICE台帳</h2>
  <label>メールアドレス</label><input id="email" type="email" autocomplete="username">
  <label>パスワード</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn primary" id="loginBtn">ログイン</button>
  <div id="loginErr"></div>
</section>

<!-- アプリ本体 -->
<div id="app" class="hidden">
  <header>
    <h1>INVOICE台帳</h1>
    <nav>
      <button data-tab="import" class="on">取込</button>
      <button data-tab="ledger">台帳</button>
    </nav>
    <div class="who"><span id="userEmail"></span><button class="btn" id="logoutBtn">ログアウト</button></div>
  </header>

  <main>
    <!-- 取込 -->
    <section id="tab-import">
      <div id="drop">
        <strong>ここにINVOICEのPDFをドラッグ＆ドロップ</strong>
        複数まとめて入れられます。読み取り後、PDFと並べて確認してから登録します。
        <div class="row">
          <button class="btn" id="pickBtn">ファイルを選ぶ</button>
          <button class="btn" id="manualBtn">手入力で登録</button>
        </div>
        <input type="file" id="fileInput" accept="application/pdf" multiple class="hidden">
      </div>
      <div id="queue"></div>
    </section>

    <!-- 台帳 -->
    <section id="tab-ledger" class="hidden">
      <div class="toolbar">
        <input type="search" id="q" placeholder="取引先・請求書番号・AWB・商品名で検索">
        <select id="fSupplier"><option value="">取引先：すべて</option></select>
        <select id="fStatus">
          <option value="">状態：すべて</option>
          <option value="要確認">要確認のみ</option>
          <option value="確認済">確認済のみ</option>
        </select>
        <input type="month" id="fMonth" title="請求月">
        <button class="btn" id="csvBtn">CSV出力</button>
        <span class="count" id="count"></span>
      </div>
      <div class="tablewrap">
        <table class="ledger">
          <thead><tr>
            <th>請求日</th><th>取引先</th><th>請求書番号</th><th>AWB番号</th><th>商品</th>
            <th style="text-align:right">数量</th><th style="text-align:right">合計</th><th>状態</th>
          </tr></thead>
          <tbody id="ledgerBody"></tbody>
        </table>
        <div class="empty hidden" id="ledgerEmpty">まだ登録がありません</div>
      </div>
    </section>
  </main>
</div>

<!-- 詳細 -->
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>

<script>
// =========================================================
// 設定：Supabase の「Project Settings → API」の値を入れてください
// =========================================================
const SUPABASE_URL = "https://dunfssyisxywxfcblgdg.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR1bmZzc3lpc3h5d3hmY2JsZ2RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNjYwODEsImV4cCI6MjEwODY0MjA4MX0.pWqKvj7sLg9z3rjSGKqPPl7YLi-FFKDcuoFlDCLkZck";
// =========================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = (s) => String(s ?? "").trim().toUpperCase().replace(/\s+/g, " ");
const toNum = (v) => { if (v === "" || v == null) return null; const n = Number(String(v).replace(/,/g, "")); return isNaN(n) ? null : n; };
const fmt = (n, d = 2) => n == null ? "" : Number(n).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtQty = (n) => n == null ? "" : Number(n).toLocaleString("en-US", { maximumFractionDigits: 3 });

// ---------- ログイン ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) showApp(session.user); else $("#login").classList.remove("hidden");
}
$("#loginBtn").onclick = async () => {
  $("#loginErr").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pw").value });
  if (error) { $("#loginErr").textContent = "ログインできませんでした。メールアドレスとパスワードを確認してください。"; return; }
  $("#login").classList.add("hidden"); showApp(data.user);
};
$("#pw").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginBtn").click(); });
$("#logoutBtn").onclick = async () => { await sb.auth.signOut(); location.reload(); };
function showApp(user) { $("#userEmail").textContent = user.email; $("#app").classList.remove("hidden"); }

// ---------- タブ ----------
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  $("#tab-import").classList.toggle("hidden", b.dataset.tab !== "import");
  $("#tab-ledger").classList.toggle("hidden", b.dataset.tab !== "ledger");
  if (b.dataset.tab === "ledger") loadLedger();
});

// ---------- 取込：ファイル受け取り ----------
const drop = $("#drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => handleFiles(e.dataTransfer.files));
$("#pickBtn").onclick = () => $("#fileInput").click();
$("#fileInput").onchange = e => { handleFiles(e.target.files); e.target.value = ""; };
$("#manualBtn").onclick = () => addCard(null);

function handleFiles(list) {
  [...list].forEach(f => {
    if (f.type !== "application/pdf" && !f.name.toLowerCase().endsWith(".pdf")) { alert(f.name + " はPDFではありません"); return; }
    addCard(f);
  });
}

const fileToBase64 = (file) => new Promise((ok, ng) => {
  const r = new FileReader();
  r.onload = () => ok(String(r.result).split(",")[1]);
  r.onerror = ng; r.readAsDataURL(file);
});

// ---------- 取込：1件ごとの確認カード ----------
function addCard(file) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head">
      <span class="fname">${esc(file ? file.name : "手入力")}</span>
      <span class="state">${file ? '<span class="spinner"></span>読み取り中…' : "入力してください"}</span>
    </div>
    <div class="card-body" ${file ? "" : 'style="grid-template-columns:1fr"'}>
      ${file ? `<iframe src="${URL.createObjectURL(file)}#view=FitH"></iframe>` : ""}
      <div class="form"></div>
    </div>`;
  $("#queue").prepend(card);
  const ctx = { card, file };
  if (!file) { renderForm(ctx, { items: [{}], notes: [] }); return; }
  readPdf(ctx);
}

async function readPdf(ctx) {
  const state = $(".state", ctx.card);
  try {
    const pdf_base64 = await fileToBase64(ctx.file);
    const { data, error } = await sb.functions.invoke("read-invoice", { body: { pdf_base64 } });
    if (error || !data?.invoice) throw new Error(data?.error || error?.message || "不明なエラー");
    state.textContent = "読み取り完了・内容を確認してください";
    renderForm(ctx, data.invoice);
  } catch (e) {
    state.textContent = "読み取りに失敗（手入力できます）";
    renderForm(ctx, { items: [{}], notes: ["自動読み取りに失敗しました：" + e.message] });
  }
}

const HEAD_FIELDS = [
  ["supplier", "取引先（発行元）", "text"], ["invoice_no", "請求書番号", "text"],
  ["invoice_date", "請求日", "date"], ["awb_no", "AWB番号", "text"],
  ["currency", "通貨", "text"], ["total_amount", "合計金額", "num"],
  ["incoterm", "取引条件", "text"], ["ship_to", "送り先", "text"],
];

function renderForm(ctx, inv) {
  const form = $(".form", ctx.card);
  form.innerHTML = `
    <div class="grid">
      ${HEAD_FIELDS.map(([k, label, t]) => `
        <div class="f"><label>${label}</label>
          <input data-k="${k}" type="${t === "date" ? "date" : "text"}" class="${t === "num" ? "num" : ""}"
                 value="${esc(t === "num" ? fmt(inv[k]) : inv[k])}"></div>`).join("")}
      <div class="f wide"><label>メモ</label><input data-k="memo" value=""></div>
    </div>
    <h4>明細</h4>
    <table class="items">
      <thead><tr><th style="width:34%">商品名</th><th>HSコード</th><th style="width:10%">数量</th><th style="width:8%">単位</th>
        <th style="width:13%">単価</th><th style="width:14%">小計</th><th style="width:6%">原産</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <button class="btn" data-act="addrow" style="margin-top:6px;font-size:12px">＋ 明細を追加</button>
    <div class="alerts"></div>
    <div class="actions">
      <button class="btn" data-act="recheck">再チェック</button>
      <button class="btn danger" data-act="discard">破棄</button>
      <button class="btn primary" data-act="save">登録する</button>
    </div>`;
  const tbody = $("tbody", form);
  (inv.items?.length ? inv.items : [{}]).forEach(it => addRow(tbody, it));
  ctx.readerNotes = inv.notes || [];

  form.addEventListener("click", async e => {
    const act = e.target.dataset.act;
    if (act === "addrow") addRow(tbody, {});
    if (act === "recheck") runChecks(ctx);
    if (act === "discard" && confirm("この取込を破棄しますか？")) ctx.card.remove();
    if (act === "save") saveInvoice(ctx, e.target);
  });
  form.addEventListener("change", () => runChecks(ctx));
  runChecks(ctx);
}

function addRow(tbody, it) {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input data-c="description" value="${esc(it.description)}"></td>
    <td><input data-c="hs_code" value="${esc(it.hs_code)}"></td>
    <td><input data-c="quantity" class="num" value="${esc(fmtQty(it.quantity))}"></td>
    <td><input data-c="unit" value="${esc(it.unit)}"></td>
    <td><input data-c="unit_price" class="num" value="${esc(it.unit_price == null ? "" : fmt(it.unit_price, 4).replace(/0{1,2}$/, ""))}"></td>
    <td><input data-c="subtotal" class="num" value="${esc(fmt(it.subtotal))}"></td>
    <td><input data-c="origin" value="${esc(it.origin)}"></td>
    <td><button class="x" title="この行を削除">×</button></td>`;
  $(".x", tr).onclick = () => { tr.remove(); };
  tbody.appendChild(tr);
}

function collect(ctx) {
  const form = $(".form", ctx.card);
  const v = {};
  form.querySelectorAll("[data-k]").forEach(i => v[i.dataset.k] = i.value.trim());
  v.total_amount = toNum(v.total_amount);
  v.currency = v.currency ? v.currency.toUpperCase() : "";
  v.items = [...form.querySelectorAll("tbody tr")].map((tr, idx) => {
    const r = { line_no: idx + 1 };
    tr.querySelectorAll("[data-c]").forEach(i => r[i.dataset.c] = i.value.trim());
    r.quantity = toNum(r.quantity); r.unit_price = toNum(r.unit_price); r.subtotal = toNum(r.subtotal);
    return r;
  }).filter(r => r.description || r.quantity != null || r.subtotal != null);
  return v;
}

// ---------- チェック（計算・重複） ----------
async function runChecks(ctx) {
  const v = collect(ctx);
  const box = $(".alerts", ctx.card);
  const hard = [], warns = [];

  // 必須
  if (!v.supplier) hard.push("取引先が空です");
  if (!v.invoice_no) hard.push("請求書番号が空です");
  if (!v.items.length) hard.push("明細が1行もありません");
  v.items.forEach(r => { if (!r.description) hard.push(`明細${r.line_no}行目の商品名が空です`); });

  // 計算チェック
  v.items.forEach(r => {
    if (r.quantity != null && r.unit_price != null && r.subtotal != null &&
        Math.abs(r.quantity * r.unit_price - r.subtotal) > 0.01)
      warns.push(`明細${r.line_no}行目：数量×単価（${fmt(r.quantity * r.unit_price)}）と小計（${fmt(r.subtotal)}）が一致しません`);
  });
  const sum = v.items.reduce((s, r) => s + (r.subtotal ?? 0), 0);
  if (v.total_amount != null && v.items.length && Math.abs(sum - v.total_amount) > 0.01)
    warns.push(`明細の小計合計（${fmt(sum)}）と合計金額（${fmt(v.total_amount)}）が一致しません（送料・値引きの可能性も確認）`);

  // 重複チェック（登録済みデータと照合）
  if (v.supplier && v.invoice_no) {
    const dup = await findDuplicates(v);
    hard.push(...dup.hard); warns.push(...dup.warns);
  }

  ctx.hard = hard; ctx.warns = warns;
  box.innerHTML =
    hard.map(t => `<div class="alert err">✕ ${esc(t)}</div>`).join("") +
    warns.map(t => `<div class="alert warn">⚠ ${esc(t)}</div>`).join("") +
    (ctx.readerNotes || []).map(t => `<div class="alert info">読み取りメモ：${esc(t)}</div>`).join("") +
    (!hard.length && !warns.length ? `<div class="alert ok">✓ 計算・重複チェックに問題はありません</div>` : "");
}

async function findDuplicates(v) {
  const hard = [], warns = [];
  const { data: same } = await sb.from("invoices").select("id,supplier,invoice_no,invoice_date,awb_no,total_amount,currency");
  const all = same || [];
  const sup = norm(v.supplier);

  // 1) 同じ取引先・同じ請求書番号 → 登録不可
  const exact = all.find(r => norm(r.supplier) === sup && norm(r.invoice_no) === norm(v.invoice_no));
  if (exact) hard.push(`この請求書（${exact.invoice_no}）は ${exact.invoice_date ?? ""} 分として登録済みです`);

  // 2) 同じAWB番号
  if (v.awb_no) {
    all.filter(r => r.awb_no && norm(r.awb_no) === norm(v.awb_no) && r !== exact)
       .forEach(r => warns.push(`同じAWB番号（${v.awb_no}）の請求書 ${r.invoice_no} がすでにあります`));
  }

  // 3) 同じ取引先・同じ合計金額・同じ明細（前後60日以内）
  const near = all.filter(r => r !== exact && norm(r.supplier) === sup &&
    r.total_amount != null && v.total_amount != null && Math.abs(r.total_amount - v.total_amount) < 0.01 &&
    (r.currency || "") === (v.currency || "") && withinDays(r.invoice_date, v.invoice_date, 60));
  if (near.length) {
    const { data: its } = await sb.from("invoice_items").select("invoice_id,description,quantity").in("invoice_id", near.map(r => r.id));
    const sig = (rows) => rows.map(r => norm(r.description) + "|" + Number(r.quantity ?? 0)).sort().join("//");
    const mine = sig(v.items);
    near.forEach(r => {
      if (sig((its || []).filter(i => i.invoice_id === r.id)) === mine)
        warns.push(`請求書 ${r.invoice_no}（${r.invoice_date ?? "日付なし"}）と商品・数量・金額がまったく同じです。二重請求か、別の発送かを確認してください`);
    });
  }
  return { hard, warns };
}
function withinDays(a, b, d) {
  if (!a || !b) return true;
  return Math.abs(new Date(a) - new Date(b)) <= d * 86400000;
}

// ---------- 登録 ----------
async function saveInvoice(ctx, btn) {
  await runChecks(ctx);
  if (ctx.hard.length) { alert("登録できません：\n・" + ctx.hard.join("\n・")); return; }
  if (ctx.warns.length && !confirm("警告があります。「要確認」として登録しますか？\n\n・" + ctx.warns.join("\n・"))) return;

  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>登録中…';
  const v = collect(ctx);
  let pdf_path = null;
  try {
    if (ctx.file) {
      const d = v.invoice_date || new Date().toISOString().slice(0, 10);
      pdf_path = `${d.slice(0, 7)}/${crypto.randomUUID()}.pdf`;
      const up = await sb.storage.from("invoice-pdfs").upload(pdf_path, ctx.file, { contentType: "application/pdf" });
      if (up.error) throw up.error;
    }
    const { data: inv, error } = await sb.from("invoices").insert({
      supplier: v.supplier, invoice_no: v.invoice_no, invoice_date: v.invoice_date || null,
      awb_no: v.awb_no || null, currency: v.currency || null, total_amount: v.total_amount,
      incoterm: v.incoterm || null, ship_to: v.ship_to || null, memo: v.memo || null,
      pdf_path, pdf_name: ctx.file ? ctx.file.name : null,
      status: ctx.warns.length ? "要確認" : "確認済",
      warning_note: ctx.warns.length ? ctx.warns.join("\n") : null,
    }).select().single();
    if (error) throw error;
    const items = v.items.map(r => ({ ...r, invoice_id: inv.id, hs_code: r.hs_code || null, unit: r.unit || null, origin: r.origin || null }));
    const ie = await sb.from("invoice_items").insert(items);
    if (ie.error) { await sb.from("invoices").delete().eq("id", inv.id); throw ie.error; }

    $(".state", ctx.card).textContent = "登録しました";
    $(".card-body", ctx.card).innerHTML = `<div class="form"><div class="alert ok">✓ ${esc(v.supplier)} / ${esc(v.invoice_no)} を${ctx.warns.length ? "「要確認」として" : ""}登録しました</div></div>`;
    setTimeout(() => ctx.card.remove(), 4000);
  } catch (e) {
    if (pdf_path) await sb.storage.from("invoice-pdfs").remove([pdf_path]);
    const msg = String(e.message || e);
    alert("登録に失敗しました：" + (msg.includes("duplicate") ? "同じ請求書がすでに登録されています" : msg));
    btn.disabled = false; btn.textContent = "登録する";
  }
}

// ---------- 台帳 ----------
let LEDGER = [];
async function loadLedger() {
  const { data, error } = await sb.from("invoices").select("*, invoice_items(*)").order("invoice_date", { ascending: false, nullsFirst: false }).order("created_at", { ascending: false });
  if (error) { alert("読み込みに失敗しました：" + error.message); return; }
  LEDGER = data.map(r => ({ ...r, invoice_items: (r.invoice_items || []).sort((a, b) => a.line_no - b.line_no) }));
  const sel = $("#fSupplier"), cur = sel.value;
  const sups = [...new Set(LEDGER.map(r => r.supplier))].sort();
  sel.innerHTML = `<option value="">取引先：すべて</option>` + sups.map(s => `<option ${s === cur ? "selected" : ""}>${esc(s)}</option>`).join("");
  drawLedger();
}
["q", "fSupplier", "fStatus", "fMonth"].forEach(id => $("#" + id).addEventListener("input", drawLedger));

function filtered() {
  const q = norm($("#q").value), s = $("#fSupplier").value, st = $("#fStatus").value, m = $("#fMonth").value;
  return LEDGER.filter(r =>
    (!s || r.supplier === s) && (!st || r.status === st) && (!m || (r.invoice_date || "").startsWith(m)) &&
    (!q || norm([r.supplier, r.invoice_no, r.awb_no, r.ship_to, r.memo, ...r.invoice_items.map(i => i.description)].join(" ")).includes(q)));
}

function drawLedger() {
  const rows = filtered();
  $("#count").textContent = `${rows.length} 件`;
  $("#ledgerEmpty").classList.toggle("hidden", rows.length > 0);
  $("#ledgerBody").innerHTML = rows.map(r => {
    const its = r.invoice_items, qty = its.reduce((s, i) => s + Number(i.quantity ?? 0), 0);
    const name = its[0] ? its[0].description + (its.length > 1 ? ` 他${its.length - 1}件` : "") : "";
    return `<tr data-id="${r.id}">
      <td class="mono">${esc(r.invoice_date ?? "")}</td><td>${esc(r.supplier)}</td>
      <td class="mono">${esc(r.invoice_no)}</td><td class="mono">${esc(r.awb_no ?? "")}</td>
      <td>${esc(name)}</td><td class="mono" style="text-align:right">${fmtQty(qty)}</td>
      <td class="mono" style="text-align:right">${fmt(r.total_amount)} ${esc(r.currency ?? "")}</td>
      <td><span class="tag ${r.status === "要確認" ? "need" : "done"}">${esc(r.status)}</span></td></tr>`;
  }).join("");
  document.querySelectorAll("#ledgerBody tr").forEach(tr => tr.onclick = () => openDetail(tr.dataset.id));
}

function openDetail(id) {
  const r = LEDGER.find(x => x.id === id); if (!r) return;
  $("#modalBox").innerHTML = `
    <h3>${esc(r.supplier)}　${esc(r.invoice_no)}</h3>
    <div class="meta">登録日時 ${new Date(r.created_at).toLocaleString("ja-JP")}${r.pdf_name ? "　/　" + esc(r.pdf_name) : ""}</div>
    <dl class="kv">
      <dt>請求日</dt><dd class="mono">${esc(r.invoice_date ?? "")}</dd><dt>AWB番号</dt><dd class="mono">${esc(r.awb_no ?? "")}</dd>
      <dt>合計</dt><dd class="mono">${fmt(r.total_amount)} ${esc(r.currency ?? "")}</dd><dt>取引条件</dt><dd>${esc(r.incoterm ?? "")}</dd>
      <dt>送り先</dt><dd>${esc(r.ship_to ?? "")}</dd><dt></dt><dd></dd>
    </dl>
    <h4>明細</h4>
    <table class="items"><thead><tr><th>商品名</th><th>HSコード</th><th style="text-align:right">数量</th><th>単位</th><th style="text-align:right">単価</th><th style="text-align:right">小計</th><th>原産</th></tr></thead>
    <tbody>${r.invoice_items.map(i => `<tr><td>${esc(i.description)}</td><td class="mono">${esc(i.hs_code ?? "")}</td>
      <td class="mono" style="text-align:right">${fmtQty(i.quantity)}</td><td>${esc(i.unit ?? "")}</td>
      <td class="mono" style="text-align:right">${i.unit_price == null ? "" : Number(i.unit_price).toLocaleString("en-US", { maximumFractionDigits: 4 })}</td>
      <td class="mono" style="text-align:right">${fmt(i.subtotal)}</td><td>${esc(i.origin ?? "")}</td></tr>`).join("")}</tbody></table>
    ${r.warning_note ? `<div class="alerts">${r.warning_note.split("\n").map(t => `<div class="alert warn">⚠ ${esc(t)}</div>`).join("")}</div>` : ""}
    <div class="grid" style="margin-top:14px">
      <div class="f"><label>状態</label><select id="dStatus"><option ${r.status === "要確認" ? "selected" : ""}>要確認</option><option ${r.status === "確認済" ? "selected" : ""}>確認済</option></select></div>
      <div class="f"></div>
      <div class="f wide"><label>メモ（確認結果など）</label><textarea id="dMemo" rows="3">${esc(r.memo ?? "")}</textarea></div>
    </div>
    <div class="actions">
      ${r.pdf_path ? `<button class="btn" id="dPdf">PDFを開く</button>` : ""}
      <button class="btn danger" id="dDel">削除</button>
      <span style="flex:1"></span>
      <button class="btn" id="dClose">閉じる</button>
      <button class="btn primary" id="dSave">保存</button>
    </div>`;
  $("#modal").classList.remove("hidden");
  $("#dClose").onclick = closeModal;
  if (r.pdf_path) $("#dPdf").onclick = async () => {
    const w = window.open("", "_blank");
    const { data, error } = await sb.storage.from("invoice-pdfs").createSignedUrl(r.pdf_path, 600);
    if (error) { w.close(); alert("PDFを開けませんでした"); return; }
    w.location = data.signedUrl;
  };
  $("#dSave").onclick = async () => {
    const { error } = await sb.from("invoices").update({ status: $("#dStatus").value, memo: $("#dMemo").value || null }).eq("id", r.id);
    if (error) { alert("保存に失敗しました：" + error.message); return; }
    closeModal(); loadLedger();
  };
  $("#dDel").onclick = async () => {
    if (!confirm(`${r.invoice_no} を削除します。元に戻せません。よろしいですか？`)) return;
    const { error } = await sb.from("invoices").delete().eq("id", r.id);
    if (error) { alert("削除に失敗しました：" + error.message); return; }
    if (r.pdf_path) await sb.storage.from("invoice-pdfs").remove([r.pdf_path]);
    closeModal(); loadLedger();
  };
}
function closeModal() { $("#modal").classList.add("hidden"); }
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

// ---------- CSV出力（明細1行＝1行） ----------
$("#csvBtn").onclick = () => {
  const head = ["請求日","取引先","請求書番号","AWB番号","通貨","合計金額","取引条件","送り先","行","商品名","HSコード","数量","単位","単価","小計","原産","状態","メモ"];
  const lines = [head];
  filtered().forEach(r => (r.invoice_items.length ? r.invoice_items : [{}]).forEach(i => lines.push([
    r.invoice_date, r.supplier, r.invoice_no, r.awb_no, r.currency, r.total_amount, r.incoterm, r.ship_to,
    i.line_no, i.description, i.hs_code, i.quantity, i.unit, i.unit_price, i.subtotal, i.origin, r.status, r.memo])));
  const csv = lines.map(l => l.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
  a.download = `INVOICE台帳_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
};

boot();
</script>
